<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sempre claro: ignora o modo escuro do sistema. -->
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#F7F6F3">
  <title>Prospecção</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232F5E8C'/%3E%3Cpath d='M4 8h8M8 4v8' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <nav class="nav">
      <a href="#/hoje" data-nav="hoje">Hoje</a>
      <a href="#/contas" data-nav="contas">Contas</a>
      <a href="#/numeros" data-nav="numeros">Números</a>
      <a href="#/importar" data-nav="importar">Importar</a>
    </nav>
    <form id="quick-create" class="quick-create" autocomplete="off">
      <input id="qc" name="name" placeholder="Nova conta: nome e Enter" aria-label="Cadastro rápido de conta" enterkeyhint="done">
      <kbd class="hint">N</kbd>
    </form>
    <button type="button" id="help-btn" class="icon-btn" title="Atalhos de teclado (?)" aria-label="Atalhos de teclado">?</button>
  </header>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/constants.js"></script>
  <script src="/app.js"></script>
</body>
</html>
